<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Akilli – Tarefas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <style>
    :root {
  --bg: #ffffff;
  --text: #0e1215;
  --muted: #5e6a6a;

  --brand-900: #0f3a36;   /* barra superior / footer */
  --brand-700: #0f4a43;
  --brand-600: #0f544c;
  --accent-600: #144e45;  /* botão principal */
  --accent-700: #0f423a;
  --surface: #e5e6e7;

  --radius-lg: 14px;
  --shadow-sm: 0 4px 10px rgba(0, 0, 0, 0.08);
  --shadow-md: 0 10px 24px rgba(0, 0, 0, 0.1);

  --container: 1120px;
  --gutter: 24px;
}

/* ======== RESET ======== */
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { 
  height: 100%; 
}
body {
  font-family: "Raleway", system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

main {
  flex: 1; /* faz o conteúdo expandir e empurrar o footer para o final */
}

/* ======== NAVBAR ======== */

.navbar {
  background: var(--brand-900);
  color: #ecf5f3;
  position: sticky;
  top: 0;
  z-index: 10;
  border-bottom: 1px solid rgba(255, 255, 255, 0.06);
}
.container {
  max-width: var(--container);
  margin: 0 auto;
  padding: 0 var(--gutter);
}
.nav-inner {
  height: 72px;
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 24px;
}
.brand {
  display: flex;
  align-items: center;
}
.brand img {
  height: 40px;
  width: auto;
  display: block;
}
.menu {
  display: flex;
  gap: 22px;
  justify-content: center;
}
.menu-link {
  color: #d8e8e5;
  text-decoration: none;
  font-weight: 500;
  font-size: 14px;
  padding: 8px 2px;
  border-radius: 8px;
  transition: color 0.15s ease, background 0.15s ease;
}
.menu-link:hover { color: #ffffff; background: rgba(255, 255, 255, 0.06); }
.btn {
  border: 0;
  cursor: pointer;
  border-radius: 999px;
  font-weight: 600;
  transition: transform 0.04s ease, box-shadow 0.2s ease, background 0.2s ease, color 0.2s ease;
}
.btn:active { transform: translateY(1px); }

/* ======== BOTÕES ======== */
.btn-outline {
  background: #e8fff9;
  color: var(--brand-900);
  padding: 10px 18px;
}
.btn-outline:hover {
  background: #ffffff;
  color: var(--brand-700);
}
.btn-primary {
  background: var(--accent-600);
  color: #eaf6f3;
  padding: 16px 28px;
  box-shadow: var(--shadow-sm);
}
.btn-primary:hover {
  background: var(--accent-700);
}

/* ======== LANDING HERO ======== */
.hero {
  display: grid;
  grid-template-columns: 1fr 1fr;
  align-items: center;
  gap: 48px;
  padding: 60px var(--gutter);
}
.hero-text {
  max-width: 520px;
}
.hero h1 {
  line-height: 1.1;
  font-size: 3.2rem;
  margin-bottom: 18px;
}
.hero .line1 { font-weight: 700; color: var(--text); }
.hero .line2 { font-weight: 700; color: var(--accent-600); }
.hero .dot { color: var(--accent-600); }
.hero .lead {
  font-size: 15px;
  color: var(--text);
  margin-bottom: 14px;
}
.hero .copy {
  font-size: 14.5px;
  color: var(--muted);
  line-height: 1.6;
  margin-bottom: 24px;
  max-width: 55ch;
}
.play-badge {
  display: inline-block;
  width: 260px;
  border-radius: 12px;
  box-shadow: 0 8px 20px rgba(45, 122, 94, 0.25);
  overflow: hidden;
}
.play-badge svg { display: block; width: 100%; height: auto; }

.hero-media {
  position: relative;
  width: 100%;
  max-width: 540px;
  justify-self: end;
  aspect-ratio: 1 / 1;
  border-radius: 50%;
  overflow: hidden;
  /* box-shadow: var(--shadow-md); */
}
.hero-media img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.hero-media::after {
  content: "";
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 25%;
  background: linear-gradient(to bottom, rgba(255,255,255,0) 0%, #fff 100%);
}

/* ======== FOOTER ======== */
.footer {
  background: var(--brand-900);
  color: #cfe6df;
  text-align: center;
  font-size: 13px;
  padding: 14px 0;
  margin-top: auto; /* força o footer a ir para o final */
}

/* ======== PÁGINA TAREFAS ======== */
.content {
  padding: 54px var(--gutter) 80px;
}
.tasks {
  display: grid;
  grid-template-columns: 420px 1fr;
  gap: 48px;
  align-items: start;
}
.tasks h1 {
  margin-bottom: 10px;
  font-size: 40px;
  font-weight: 700;
}
.tasks p {
  color: var(--muted);
  line-height: 1.6;
  margin-bottom: 26px;
  max-width: 38ch;
}
.tasks-board {
  min-height: 360px;
  background: var(--surface);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-md);
  display: grid;
  place-items: center;
}
.board-empty {
  color: #7a7f82;
  font-size: 14px;
  text-align: center;
}

/* ======== RESPONSIVO ======== */
@media (max-width: 980px) {
  .hero { grid-template-columns: 1fr; text-align: center; }
  .hero-text { margin: 0 auto; }
  .hero-media { justify-self: center; max-width: 420px; }
  .tasks { grid-template-columns: 1fr; }
  .menu { display: none; }
}
@media (max-width: 640px) {
  .hero h1 { font-size: 2.3rem; }
  .play-badge { width: 220px; }
}

  </style>
  <!-- NAVBAR -->
  <header class="navbar">
    <div class="container nav-inner">
      <div class="brand">
      <img src="../img/akilli.svg" alt="Logo Akilli">
      
    </div>

      <nav class="menu">
        <a href="#" class="menu-link">Tarefas</a>
        <a href="#" class="menu-link">Foco</a>
        <a href="#" class="menu-link">Distrações</a>
        <a href="#" class="menu-link">Ranking</a>
      </nav>

      <div class="actions">
        <button class="btn btn-outline">Entrar</button>
      </div>
    </div>
  </header>

  <!-- CONTEÚDO -->
  <main class="content container">
    <section class="tasks">
      <div class="tasks-text">
        <h1>Tarefas</h1>
        <p>
          Defina suas metas e tarefas importantes. O app usa essas
          informações para lembrar você do que realmente importa quando
          surgir uma distração.
        </p>

        <button class="btn btn-primary">Nova Tarefa</button>
      </div>

      <div class="tasks-board" role="region" aria-label="Quadro de tarefas">
        <span class="board-empty">Nenhuma Tarefa Registrada</span>
      </div>
    </section>
  </main>
</body>
</html>
